<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 820" role="img" aria-labelledby="title desc">
  <title id="title">Placa ESP32-S3-N8R2</title>
  <desc id="desc">Ilustración técnica vectorial frontal con módulo ESP32-S3, antena, pines, botones, LED, circuitos y dos conectores USB-C.</desc>
